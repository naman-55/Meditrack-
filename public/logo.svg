<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 52" fill="none">
  <defs>
    <linearGradient id="logo-icon-grad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D6B0"/>
      <stop offset="50%" stop-color="#00A884"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="logo-pulse-grad" x1="12" y1="26" x2="36" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00D6B0" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Icon emblem -->
  <rect x="4" y="4" width="44" height="44" rx="12" fill="url(#logo-icon-grad)" filter="url(#logo-glow)"/>
  <rect x="4.5" y="4.5" width="43" height="43" rx="11.5" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
  <path d="M26 12V19M26 33V40" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.5"/>
  <path d="M12 26H18L21 18L26 34L31 20L34 26H40" stroke="url(#logo-pulse-grad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="40" cy="26" r="1.8" fill="#FFFFFF"/>

  <!-- Typography: MediTrack -->
  <text x="60" y="32" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#0F172A">
    Medi<tspan fill="#00A884">Track</tspan>
  </text>
  
  <!-- Version badge -->
  <rect x="168" y="16" width="38" height="18" rx="6" fill="#E6F7F3"/>
  <text x="187" y="29" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#00A884" text-anchor="middle">v3.2</text>
</svg>
