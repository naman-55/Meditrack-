<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="meditrack-grad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D6B0"/>
      <stop offset="50%" stop-color="#00A884"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="pulse-grad" x1="10" y1="24" x2="38" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00D6B0" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle with subtle clinical gradient -->
  <rect x="3" y="3" width="42" height="42" rx="12" fill="url(#meditrack-grad)" filter="url(#glow)"/>
  
  <!-- Subtle inner border overlay for glassmorphism / depth -->
  <rect x="3.5" y="3.5" width="41" height="41" rx="11.5" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1"/>
  
  <!-- Stylized Clinical Plus & Vital Pulse ECG Line -->
  <path d="M24 10V18M24 30V38" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.5"/>
  <path d="M10 24H16L19 16L24 32L29 18L32 24H38" stroke="url(#pulse-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Trajectory accent dot -->
  <circle cx="38" cy="24" r="2" fill="#FFFFFF"/>
</svg>
