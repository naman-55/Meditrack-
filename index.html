<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediTrack V3.1</title>
    <meta name="description" content="Clinical biomarker tracking, health risk analysis, and live nearby medical specialists map." />
    <meta property="og:title" content="MediTrack V3.1" />
    <meta property="og:description" content="Clinical biomarker tracking, health risk analysis, and live nearby medical specialists map." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#050D18" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300D6B0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M22 12h-4l-3 9L9 3l-3 9H2'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('meditrack_user_preferences_v2');
          var theme = saved ? JSON.parse(saved)?.appearance?.theme : 'Light';
          var isDark = theme === 'Dark' || (theme === 'System' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F7F9FB] dark:bg-[#050D18] text-[#1E293B] dark:text-[#F3F7FC] antialiased">
    <noscript>
      <div style="padding: 24px; text-align: center; font-family: sans-serif; background: #050D18; color: #F3F7FC;">
        MediTrack requires JavaScript to be enabled in order to run.
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
